<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a0f1e" />
  <title>For You 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>" />
</head>
<body data-mood="soft">

  <!-- animated background layers -->
  <canvas id="petals"></canvas>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="vignette"></div>

  <!-- floating controls -->
  <div class="controls">
    <button id="soundBtn" class="ctrl" title="Sound on / off" aria-label="Toggle sound">🔊</button>
    <button id="musicBtn" class="ctrl" title="Music on / off" aria-label="Toggle music">🎵</button>
  </div>

  <!-- the cat companion 🐱 -->
  <div id="cat" class="cat" title="pet me!">
    <svg viewBox="0 0 120 120" width="88" height="88" aria-hidden="true">
      <g class="cat-tail"><path d="M92 78 q26 4 20 -26 q-2 -12 -12 -12 q10 6 6 20 q-4 14 -18 10 z"/></g>
      <ellipse class="cat-shadow" cx="60" cy="104" rx="30" ry="6"/>
      <path class="cat-body" d="M30 60 q0 -6 6 -6 h48 q6 0 6 6 v22 q0 14 -14 14 h-32 q-14 0 -14 -14 z"/>
      <path class="cat-head" d="M35 34 l8 -16 l14 12 h6 l14 -12 l8 16 q8 10 8 22 q0 22 -30 22 t-30 -22 q0 -12 8 -22 z"/>
      <g class="cat-eyes">
        <ellipse class="eye" cx="49" cy="52" rx="5.5" ry="7"/>
        <ellipse class="eye" cx="71" cy="52" rx="5.5" ry="7"/>
      </g>
      <path class="cat-nose" d="M57 62 h6 l-3 4 z"/>
      <g class="cat-whiskers" stroke-linecap="round">
        <line x1="42" y1="60" x2="24" y2="56"/><line x1="42" y1="64" x2="24" y2="66"/>
        <line x1="78" y1="60" x2="96" y2="56"/><line x1="78" y1="64" x2="96" y2="66"/>
      </g>
      <path class="cat-blush" d="M40 66 q4 3 8 0" fill="none"/>
      <path class="cat-blush" d="M72 66 q4 3 8 0" fill="none"/>
    </svg>
    <span class="cat-bubble" id="catBubble">meow 💕</span>
  </div>

  <!-- ===================== SECTIONS ===================== -->
  <main id="app"><!-- built by script.js from config.js --></main>

  <!-- gallery lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
    <img id="lightboxImg" alt="" />
    <button id="lightboxClose" class="lightbox-close" aria-label="Close">×</button>
  </div>

  <div id="loveHint" class="love-hint">tap anywhere for a little love 💗</div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
